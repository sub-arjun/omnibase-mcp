# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({command:'python', args:['mcp-server.py'], env:{LLAMA_CLOUD_API_KEY:config.llamaCloudApiKey, OPENAI_API_KEY:config.openaiApiKey}})
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - llamaCloudApiKey
      - openaiApiKey
    properties:
      llamaCloudApiKey:
        type: string
      openaiApiKey:
        type: string
  exampleConfig:
    llamaCloudApiKey: sk-llamacloud123456
    openaiApiKey: sk-openai123456
